[package]
name = "horbyta"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "horbyta"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
moka = { version = "0.12.15", features = ["future"] }
password-hash = "0.6.1"
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["fmt", "env-filter"]}
uuid = { version = "1.23.0", features = ["v7"] }
validator = { version = "0.20.0", features = ["derive"] }
futures = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs"] }
strum = { version = "0.28", features = ["derive"] }
sha2 = "0.11.0"
rand = "0.10.1"
hex = "0.4.3"
duration-str = "0.21.0"
object_store = { version = "0.13.2", features = ["aws"] }

[profile.dev]
debug = 0
incremental = true

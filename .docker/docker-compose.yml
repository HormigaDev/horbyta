services:
  horbyta_app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      args:
        BINARY_NAME: ${BINARY_NAME}
    image: pm/horbyta-app:${APP_VERSION:-latest}
    container_name: horbyta_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RUST_PORT:-8890}:8890"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      PORT: "8890"
      APP_URI: "0.0.0.0:8890"
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_CLIENT: ${JWT_SECRET_CLIENT}
      TIME_TO_EXP_SESSION: ${TIME_TO_EXP_SESSION}
      APP_ENV: production
      UPLOAD_DIR: /app/data/storage
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION}
    volumes:
      - ../data/storage:/app/data/storage
    networks:
      - pm_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  pm_internal:
    name: pm_internal
    driver: bridge
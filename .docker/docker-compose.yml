services:
  horbyta_app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.rust
      args:
        BINARY_NAME: ${BINARY_NAME}
    image: pm/horbyta-app:${APP_VERSION:-latest}
    container_name: horbyta_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RUST_PORT:-8890}:8890"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      PORT: "8890"
      APP_URI: "0.0.0.0:8890"
      HORBYTA_AI_ADDR: "horbyta_ai:${GRPC_PORT:-50051}"
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
      AI_PREFS_ENCRYPTION_KEY: ${AI_PREFS_ENCRYPTION_KEY}  
    depends_on:
      horbyta_ai:
        condition: service_healthy
    networks:
      - pm_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  horbyta_ai:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.python
    image: pm/horbyta-ai:${APP_VERSION:-latest}
    container_name: horbyta_ai
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GRPC_PORT: "${GRPC_PORT:-50051}"
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      EVICTION_INTERVAL_SECONDS: ${EVICTION_INTERVAL_SECONDS:-60}
      TOOL_WAIT_TIMEOUT_SECONDS: ${TOOL_WAIT_TIMEOUT_SECONDS:-30}
      APP_ENV: production
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME}
      OPENROUTER_ENABLE_CACHE_CONTROL: ${OPENROUTER_ENABLE_CACHE_CONTROL}
      OPENROUTER_CACHE_TTL: ${OPENROUTER_CACHE_TTL}
    networks:
      - pm_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pm_internal:
    name: pm_internal
    driver: bridge
services:
  horbyta_app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.rust.dev
    environment:
      RUST_LOG: ${RUST_LOG:-debug,sqlx=debug,tower_http=debug}
      APP_ENV: development
    command: >
      bash -c "
        ./init.sh check-only &&
        cargo watch -x 'run' -w src
      "
    volumes:
      - ../src:/app/src:ro
      - ../Cargo.toml:/app/Cargo.toml:ro
      - ../Cargo.lock:/app/Cargo.lock:ro
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    deploy:
      resources:
        limits:
          memory: 1G

  horbyta_ai:
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GRPC_PORT: ${GRPC_PORT:-50051}
    ports:
      - "127.0.0.1:${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    volumes:
      - ../horbyta_ai/src:/app/src/:ro
      - ../horbyta_ai/generated:/app/generated
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  cargo_cache:
  target_cache:
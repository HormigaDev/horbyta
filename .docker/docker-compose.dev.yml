services:
  horbyta_app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.dev
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    environment:
      RUST_LOG: ${RUST_LOG:-debug,sqlx=debug,tower_http=debug}
      RUSTFLAGS: "-C debuginfo=0 -C link-arg=-Wl,--no-keep-memory"
      CARGO_BUILD_JOBS: "1"
      APP_ENV: development
      APP_URI: 0.0.0.0:8890
      DATABASE_URL: ${DATABASE_URL}
      PORT: "8890"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:9000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_CLIENT: ${JWT_SECRET_CLIENT}
      TIME_TO_EXP_SESSION: ${TIME_TO_EXP_SESSION}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION}
    command:
      - "echo '[INIT] Rust manual mode enabled. Container will stay alive for manual execution.' && exec sleep infinity"
    healthcheck:
      disable: true
    volumes:
      - ../src:/app/src:ro
      - ../Cargo.toml:/app/Cargo.toml:ro
      - ../Cargo.lock:/app/Cargo.lock:ro
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  cargo_cache:
  target_cache:

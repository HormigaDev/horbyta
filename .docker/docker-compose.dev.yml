services:
  horbyta_app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.rust.dev
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    environment:
      RUST_LOG: ${RUST_LOG:-debug,sqlx=debug,tower_http=debug}
      RUSTFLAGS: "-C debuginfo=0 -C link-arg=-Wl,--no-keep-memory"
      CARGO_BUILD_JOBS: "1"
      APP_ENV: development
      APP_URI: 0.0.0.0:8890
      DATABASE_URL: ${DATABASE_URL}
      PORT: "8890"
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://horbyta_ai:${GRPC_PORT:-50051}}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:9000}
      JWT_SECRET: ${JWT_SECRET}
      AI_PREFS_ENCRYPTION_KEY: ${AI_PREFS_ENCRYPTION_KEY}
    command:
      - "echo '[INIT] Rust manual mode enabled. Container will stay alive for manual execution.' && exec sleep infinity"
    healthcheck:
      disable: true
    volumes:
      - ../src:/app/src:ro
      - ../Cargo.toml:/app/Cargo.toml:ro
      - ../Cargo.lock:/app/Cargo.lock:ro
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    deploy:
      resources:
        limits:
          memory: 2G

  horbyta_ai:
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      GRPC_PORT: ${GRPC_PORT:-50051}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME}
      OPENROUTER_ENABLE_CACHE_CONTROL: ${OPENROUTER_ENABLE_CACHE_CONTROL}
      OPENROUTER_CACHE_TTL: ${OPENROUTER_CACHE_TTL}
    ports:
      - "127.0.0.1:${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    volumes:
      - ../horbyta_ai/src:/app/src/:ro
      - ../horbyta_ai/generated:/app/generated
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  cargo_cache:
  target_cache:

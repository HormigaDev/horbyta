# Nginx http{} block directives required by pm-api.conf
#
# Place this file at /etc/nginx/conf.d/pm-http-directives.conf
# (or include it from /etc/nginx/nginx.conf inside the http {} block).
#
# Verify with: sudo nginx -t
# Reload with: sudo systemctl reload nginx

# ── Rate-limiting zones ───────────────────────────────────────────────────────
# General zone: 20 requests/second per client IP, 10 MB state store
limit_req_zone $binary_remote_addr zone=pm_api:10m      rate=20r/s;

# Auth zone: 5 requests/minute per client IP (login, register, magic-token login)
limit_req_zone $binary_remote_addr zone=pm_api_auth:10m rate=5r/m;

# ── WebSocket upgrade map ─────────────────────────────────────────────────────
# Required for proxy_set_header Connection $connection_upgrade in pm-api.conf
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ''       close;
}

server {
    listen 80;
    listen [::]:80;

    server_name $REPLACE_WITH_YOUR_DOMAIN;

    root /opt/horbyta/frontend/dist/pwa;
    index index.html;

    location ^~ /ws {
        limit_req zone=pm_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location ^~ /api/ {
        limit_req zone=pm_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8890;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────── API AUTH ───────────
    location ~ ^/api/v1/auth/(login|login-client|login-client-token|register)$ {
        limit_req zone=pm_api_auth burst=3 nodelay;
        limit_req zone=pm_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8890;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────── STATIC ASSETS ───────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─────────── SPA FALLBACK ───────────
    location / {
        try_files $uri /index.html;
    }
}

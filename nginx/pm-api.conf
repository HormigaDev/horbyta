# /etc/nginx/sites-available/pm-api

server {
    listen 80;
    listen [::]:80;

    server_name horbyta.hormiga.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~ ^/api/v1/auth/(login|login-client|login-client-token|register)$ {
        limit_req zone=pm_api_auth burst=3  nodelay;
        limit_req zone=pm_api      burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header X-Powered-By;
    }

    location / {
        limit_req zone=pm_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header X-Powered-By;
    }
}
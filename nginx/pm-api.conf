# /etc/nginx/sites-available/pm-api
#
# Drop this file in /etc/nginx/sites-available/ and symlink:
#   sudo ln -s /etc/nginx/sites-available/pm-api /etc/nginx/sites-enabled/pm-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# After enabling, run Certbot to get the certificate:
#   sudo certbot --nginx -d api.horbyta.hormiga.dev
# Certbot will update this file automatically with SSL directives.
#
# REQUIRED: copy nginx/http-directives.conf to /etc/nginx/conf.d/pm-http-directives.conf
# before reloading. That file defines the limit_req_zone zones and the WebSocket
# upgrade map ($connection_upgrade) that this vhost depends on.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.horbyta.hormiga.dev;

    # Let Certbot handle ACME challenges; redirect everything else
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.horbyta.hormiga.dev;

    # Certbot will populate / manage these paths
    ssl_certificate     /etc/letsencrypt/live/api.horbyta.hormiga.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.horbyta.hormiga.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'"  always;

    # Request constraints — 50 MB matches the backend attachment limit
    client_max_body_size  50m;
    client_body_timeout   30s;
    client_header_timeout 10s;

    # ── Auth endpoints: strict rate limit (5 r/min) + general limit ──────────
    # A location block does NOT inherit the server-level limit_req, so pm_api
    # must be listed here explicitly alongside the stricter pm_api_auth zone.
    location ~ ^/api/v1/auth/(login|login-client|login-client-token|register)$ {
        limit_req zone=pm_api_auth burst=3  nodelay;
        limit_req zone=pm_api      burst=40 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:${RUST_PORT:-8080};
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout 10s;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_hide_header X-Powered-By;
    }

    # ── All other routes: general rate limit (20 r/s) ────────────────────────
    location / {
        limit_req zone=pm_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:${RUST_PORT:-8080};
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generous timeouts for streaming / long-running calls
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_hide_header X-Powered-By;
    }
}

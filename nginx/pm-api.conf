# /etc/nginx/sites-available/pm-api
#
# Drop this file in /etc/nginx/sites-available/ and symlink:
#   sudo ln -s /etc/nginx/sites-available/pm-api /etc/nginx/sites-enabled/pm-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# After enabling, run Certbot to get the certificate:
#   sudo certbot --nginx -d api.horbyta.hormiga.dev
# Certbot will update this file automatically with SSL directives.
#
# The rate limiting zone (limit_req_zone) must live in nginx.conf's http {}.
# Add this line there if it's not already present:
#   limit_req_zone $binary_remote_addr zone=pm_api:10m rate=20r/s;

# HTTP → HTTPS redirect 
server {
    listen 80;
    listen [::]:80;
    server_name api.horbyta.hormiga.dev;

    # Let Certbot handle ACME challenges; redirect everything else
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.horbyta.hormiga.dev;

    # Certbot will populate / manage these paths
    ssl_certificate     /etc/letsencrypt/live/api.horbyta.hormiga.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.horbyta.hormiga.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers 
    add_header X-Frame-Options           "DENY"                          always;
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Tighten CSP to match your actual frontend origin in production
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'" always;

    # Rate limiting 
    # Burst allows short spikes; nodelay serves them immediately without queuing
    limit_req zone=pm_api burst=40 nodelay;
    limit_req_status 429;

    #  Request constraints 
    client_max_body_size 4m;
    client_body_timeout  30s;
    client_header_timeout 10s;

    #  Proxy to Rust backend (Docker container bound to 127.0.0.1) 
    location / {
        proxy_pass         http://127.0.0.1:${RUST_PORT:-8080};
        proxy_http_version 1.1;

        # WebSocket support (Axum / tower-http handle upgrade)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for streaming / long-running agent calls
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  10s;

        # Hide upstream server header
        proxy_hide_header X-Powered-By;

        # Do not buffer streaming responses
        proxy_buffering    off;
        proxy_cache        off;
    }
}

#  WebSocket upgrade map (add to nginx.conf http{} if not present) 
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
syntax = "proto3";

package horbyta_service;

service AiService {
  rpc Chat (ChatRequest) returns (stream ChatChunk);
  rpc SubmitToolResult (ToolResultRequest) returns (ToolResultResponse);
}

message ChatRequest {
  string user_id       = 1;
  string session_id    = 2;
  string user_message  = 3;
  repeated ToolSchema available_tools = 4;
}

message ChatChunk {
  oneof payload {
    string   text_delta = 1;
    ToolCall tool_call  = 2;
    string   done       = 3;
    string   error      = 4;
  }
}

message ToolSchema {
  string name            = 1;
  string description     = 2;
  string parameters_json = 3;
}

message ToolCall {
  string id             = 1;
  string name           = 2;
  string arguments_json = 3;
}

message ToolResultRequest {
  string user_id       = 1;
  string session_id    = 2;
  string tool_call_id  = 3;
  string result_json   = 4;
  bool   success       = 5;
  string error_message = 6;
}

message ToolResultResponse {}
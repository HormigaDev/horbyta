syntax = "proto3";

package horbyta_service;

service AiService {
    rpc Chat (ChatRequest) returns (stream ChatChunk);
    
    rpc SubmitToolResult (ToolResultRequest) returns (ToolResultResponse);
}

message ChatRequest {
    string session_id = 1;
    string user_message = 2;
    repeated ToolSchema available_tools = 3;
    repeated HistoryEntry history = 4;
}

message HistoryEntry {
    string role = 1; // "user" | "assistant" | "tool" 
    string content = 2;
}

message ChatChunk {
    oneof payload {
        string text_delta = 1;
        ToolCall tool_call = 2;
        string done = 3;
        string error = 4;
    }    
}

message ToolSchema {
    string name = 1;
    string description = 2;
    string parameters_json = 3;    
}

message ToolCall {
    string id = 1;
    string name = 2;
    string aruments_json = 3;
}

message ToolResultRequest {
    string session_id = 1;
    string tool_call_id = 2;
    string result_json = 3;
    bool success = 4;
    string error_message = 5;
}

message ToolResultResponse {
    // Intentionally empty - acknowledgement only.
    // Subsequest tokens arrive via the still-open Chat stream.
}